# 1. اسم التطبيق (لازم يكون مميز وغير مكرر في العالم)
# غير كلمة "hunter-pro-crm-x" لأي اسم يعجبك (مثلاً hunter-pro-raji-crm)
app = "hunter-pro-crm-x"

# 2. المكان (أمستردام قريبة من مصر وسريعة)
primary_region = "ams"

[build]
  # هنستخدم الدوكر فايل اللي عملناه
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
