<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunter Pro CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#0f172a',    // كحلي غامق (الخلفية)
                        bgCard: '#1e293b',    // كحلي فاتح (القوائم)
                        accent: '#3b82f6',    // أزرق اللوجو
                        gold: '#fbbf24',      // ذهبي
                        textGray: '#94a3b8'   // رصاصي للنصوص
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        
        /* إخفاء شريط التمرير لشكل أنظف */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* منطقة الكتابة المثبتة تحت */
        .chat-input-area {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1e293b; padding: 12px; z-index: 50;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        /* مسافة عشان الكلام مايختفيش ورا القائمة السفلية */
        .safe-area { padding-bottom: 90px; }

        .nav-item.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border-right: 3px solid #3b82f6; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-bgMain bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
        <div class="w-24 h-24 bg-accent rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30">
            <i class="fa-solid fa-bullseye text-5xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2">Hunter Pro</h1>
        <p class="text-textGray mb-8">سجل دخولك لبدء العمل</p>
        
        <div class="w-full max-w-xs space-y-4 px-4">
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl bg-bgCard border border-slate-700 text-center text-white outline-none focus:border-accent">
            <input type="text" id="name" placeholder="الاسم" class="w-full p-4 rounded-xl bg-bgCard border border-slate-700 text-center text-white outline-none focus:border-accent">
            <button onclick="login()" class="w-full p-4 bg-accent rounded-xl font-bold shadow-lg active:scale-95 transition">دخول للنظام 🚀</button>
            <p id="loginMsg" class="text-center text-red-400 text-sm h-5"></p>
        </div>
    </div>

    <div id="mainApp" class="flex-1 flex hidden h-full w-full">
        
        <aside id="sidebar" class="w-64 bg-bgCard border-l border-slate-700 absolute md:relative z-40 h-full transform translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="p-6 flex items-center gap-3 border-b border-slate-700">
                <i class="fa-solid fa-bullseye text-accent text-2xl"></i>
                <span class="font-bold text-lg">Hunter Pro</span>
            </div>
            <nav class="p-4 space-y-2">
                <button onclick="showTab('dashboard')" class="nav-item active w-full flex items-center gap-4 p-3 rounded-lg transition">
                    <i class="fa-solid fa-chart-pie w-6 text-center"></i> الرئيسية
                </button>
                <button onclick="showTab('leads')" class="nav-item w-full flex items-center gap-4 p-3 rounded-lg text-textGray hover:text-white transition">
                    <i class="fa-solid fa-users w-6 text-center"></i> العملاء
                </button>
                <button onclick="showTab('chat')" class="nav-item w-full flex items-center gap-4 p-3 rounded-lg text-textGray hover:text-white transition">
                    <i class="fa-solid fa-robot w-6 text-center"></i> المحاور الذكي
                </button>
            </nav>
            <div class="absolute bottom-0 w-full p-4 border-t border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-accent">A</div>
                    <div>
                        <div class="text-sm font-bold">Admin</div>
                        <div class="text-xs text-gold">🪙 <span id="balance">--</span></div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-bgMain relative w-full overflow-hidden">
            
            <header class="h-16 flex items-center justify-between px-4 bg-bgCard border-b border-slate-700 shrink-0">
                <div class="flex items-center gap-3">
                    <button class="md:hidden text-textGray" onclick="toggleSidebar()"><i class="fa-solid fa-bars text-xl"></i></button>
                    <span class="font-bold">لوحة التحكم</span>
                </div>
                <div class="bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-xs font-bold text-gold">
                    🪙 <span id="headerBalance">--</span>
                </div>
            </header>

            <div id="view-dashboard" class="flex-1 overflow-y-auto p-4 safe-area space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-bgCard p-5 rounded-2xl border border-slate-700">
                        <i class="fa-solid fa-users text-accent text-2xl mb-2"></i>
                        <div class="text-2xl font-bold">27</div>
                        <div class="text-xs text-textGray">إجمالي العملاء</div>
                    </div>
                    <div class="bg-bgCard p-5 rounded-2xl border border-slate-700">
                        <i class="fa-solid fa-star text-gold text-2xl mb-2"></i>
                        <div class="text-2xl font-bold">15</div>
                        <div class="text-xs text-textGray">جودة ممتازة</div>
                    </div>
                </div>
                <div class="bg-bgCard p-4 rounded-2xl border border-slate-700 h-48 flex items-center justify-center">
                    <div class="text-center text-slate-600">
                        <i class="fa-solid fa-chart-area text-4xl mb-2"></i>
                        <p class="text-sm">إحصائيات الأداء</p>
                    </div>
                </div>
            </div>

            <div id="view-leads" class="hidden flex-1 overflow-y-auto p-4 safe-area space-y-3">
                
                <div class="bg-bgCard p-4 rounded-xl border border-slate-700 relative">
                    <div class="flex gap-4">
                        <div class="w-12 h-12 bg-slate-700 rounded-full flex items-center justify-center text-accent">
                            <i class="fa-solid fa-user text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm text-white mb-1">أنا شركة استثمارية - القاهرة</h3>
                            <div class="text-xs text-textGray mb-1"><i class="fa-solid fa-phone w-4"></i> 01045387332</div>
                            <div class="text-xs text-textGray"><i class="fa-solid fa-location-dot w-4"></i> القاهرة</div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="bg-[#064e3b] text-[#34d399] text-[10px] px-2 py-0.5 rounded font-bold">NEW</span>
                            <div class="text-gold text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        </div>
                    </div>
                </div>

                <div class="bg-bgCard p-4 rounded-xl border border-slate-700 relative">
                    <div class="flex gap-4">
                        <div class="w-12 h-12 bg-slate-700 rounded-full flex items-center justify-center text-accent">
                            <i class="fa-solid fa-user text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm text-white mb-1">عميل 12 - الجيزة</h3>
                            <div class="text-xs text-textGray mb-1"><i class="fa-solid fa-phone w-4"></i> 01010000000</div>
                            <div class="text-xs text-textGray"><i class="fa-solid fa-location-dot w-4"></i> الجيزة</div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="bg-slate-700 text-slate-300 text-[10px] px-2 py-0.5 rounded font-bold">MANUAL</span>
                            <div class="text-gold text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="view-chat" class="hidden flex-1 flex flex-col h-full relative">
                <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
                    <div class="flex justify-start">
                        <div class="bg-bgCard border border-slate-700 p-3 rounded-2xl rounded-tr-none max-w-[85%] text-sm">
                            أهلاً يا هندسة! 👋<br>أنا جاهز للمساعدة.
                        </div>
                    </div>
                </div>

                <div class="chat-input-area flex gap-2">
                    <input type="text" id="msgInput" class="flex-1 bg-bgMain border border-slate-600 rounded-xl px-4 py-3 text-white outline-none focus:border-accent" placeholder="اكتب رسالتك..." autocomplete="off">
                    <button onclick="send()" class="bg-accent w-12 h-12 rounded-xl flex items-center justify-center text-white shadow-lg active:scale-95">
                        <i class="fa-solid fa-paper-plane transform rotate-180"></i>
                    </button>
                </div>
            </div>

        </main>
        
        <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>
    </div>

    <script>
        const API = ""; 
        let uid = null;

        function showTab(id) {
            ['dashboard', 'leads', 'chat'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById(`view-${id}`).classList.remove('hidden');
            
            if(window.innerWidth < 768) toggleSidebar(); // قفل القائمة في الموبايل
            
            // تلوين الزرار
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('overlay');
            if(sb.classList.contains('translate-x-full')) {
                sb.classList.remove('translate-x-full');
                ov.classList.remove('hidden');
            } else {
                sb.classList.add('translate-x-full');
                ov.classList.add('hidden');
            }
        }

        // تسجيل الدخول
        async function login() {
            const em = document.getElementById('email').value;
            const nm = document.getElementById('name').value;
            const msg = document.getElementById('loginMsg');
            
            if(!em || !nm) { msg.innerText = "اكتب بياناتك"; return; }
            msg.innerText = "جاري الاتصال..."; msg.style.color = "#fbbf24";

            try {
                const r = await fetch(`${API}/users/`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({email:em, full_name:nm, password:"123"})
                });
                
                if(r.ok || r.status===400) {
                    const d = r.ok ? await r.json() : {id:1, wallet_balance:50};
                    uid = d.id || 1;
                    
                    document.getElementById('balance').innerText = d.wallet_balance || 50;
                    document.getElementById('headerBalance').innerText = d.wallet_balance || 50;
                    
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                } else { msg.innerText = "خطأ في السيرفر"; msg.style.color = "red"; }
            } catch(e) { msg.innerText = "فشل الاتصال"; msg.style.color = "red"; }
        }

        // الشات
        async function send() {
            const inp = document.getElementById('msgInput');
            const txt = inp.value.trim();
            const box = document.getElementById('chatBox');
            if(!txt) return;

            box.innerHTML += `<div class="flex justify-end"><div class="bg-accent text-white p-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm">${txt}</div></div>`;
            inp.value = "";
            box.scrollTop = box.scrollHeight;

            try {
                const r = await fetch(`${API}/chat/${uid}`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({message:txt})
                });
                const d = await r.json();

                if(r.ok) {
                    const htm = marked.parse(d.response);
                    box.innerHTML += `<div class="flex justify-start"><div class="bg-bgCard border border-slate-700 text-slate-200 p-3 rounded-2xl rounded-tr-none max-w-[85%] text-sm prose prose-invert">${htm}</div></div>`;
                    // تحديث الرصيد
                    if(d.tokens_used) {
                         const current = parseInt(document.getElementById('balance').innerText);
                         document.getElementById('balance').innerText = current - d.tokens_used;
                         document.getElementById('headerBalance').innerText = current - d.tokens_used;
                    }
                } else {
                    box.innerHTML += `<div class="text-center text-red-400 text-xs my-2">⚠️ ${d.detail}</div>`;
                }
            } catch(e) {
                box.innerHTML += `<div class="text-center text-red-400 text-xs my-2">خطأ اتصال</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
